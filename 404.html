<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Skorvexa</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0e10">
  <meta name="color-scheme" content="dark">
  <!-- Self-contained: hosts serve this file at any missing path, so it can't rely on relative asset URLs. -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0e10; color: #f4f2ec;
      font: 500 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 560px; padding: 32px 20px; }
    p.eyebrow { margin: 0 0 6px; color: #a2a5ac; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; }
    h1 { margin: 0; font-size: 44px; line-height: 1.02; letter-spacing: -1.25px; text-transform: uppercase; }
    hr { height: 2px; border: 0; background: #f4f2ec; margin: 16px 0; }
    p { color: #a2a5ac; }
    a { display: inline-flex; align-items: center; height: 48px; padding: 0 20px; margin-top: 8px; border-radius: 3px;
      background: #557eff; color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
    a:focus-visible { outline: 2px solid #c8f532; outline-offset: 3px; }
    i { display: inline-block; width: 7px; height: 7px; background: #c8f532; margin-right: 8px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow"><i></i>404 / Off the pitch</p>
    <h1>Page not found</h1>
    <hr>
    <p>This page doesn't exist. Head back to the home page for support, privacy and terms.</p>
    <a id="home" href="/">Back to home</a>
  </main>
  <script>
    // GitHub Pages project sites live under /<repo>/, so "/" would leave the site.
    if (location.hostname.endsWith('github.io')) {
      var repo = location.pathname.split('/')[1];
      if (repo) document.getElementById('home').href = '/' + repo + '/';
    }
  </script>
</body>
</html>
